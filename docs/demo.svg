<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 300" role="img" aria-label="A mouse moves across three monitors. Only the monitor under the mouse is lit.">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b7fd6"/>
      <stop offset="1" stop-color="#6a4bc4"/>
    </linearGradient>
    <g id="app">
      <rect width="150" height="92" rx="4" fill="#ffffff"/>
      <rect width="150" height="14" rx="4" fill="#d9dee5"/>
      <rect x="12" y="26" width="110" height="7" rx="3" fill="#8b95a3"/>
      <rect x="12" y="42" width="126" height="7" rx="3" fill="#b9c1cc"/>
      <rect x="12" y="58" width="92" height="7" rx="3" fill="#b9c1cc"/>
      <rect x="12" y="74" width="60" height="7" rx="3" fill="#2b7fd6"/>
    </g>
  </defs>

  <rect width="705" height="300" rx="14" fill="#17191d"/>

  <!-- Monitor 1 -->
  <rect x="24" y="72" width="248" height="143" rx="6" fill="#4a4f57"/>
  <rect x="28" y="76" width="240" height="135" fill="url(#wall)"/>
  <use href="#app" x="73" y="96"/>
  <rect x="28" y="76" width="240" height="135" fill="#000">
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete"
      keyTimes="0;0.305;0.97;1" values="0;1;0;0"/>
  </rect>
  <rect x="136" y="215" width="24" height="14" fill="#4a4f57"/>
  <rect x="116" y="229" width="64" height="6" rx="3" fill="#4a4f57"/>

  <!-- Monitor 2 -->
  <rect x="286" y="72" width="248" height="143" rx="6" fill="#4a4f57"/>
  <rect x="290" y="76" width="240" height="135" fill="url(#wall)"/>
  <use href="#app" x="335" y="96"/>
  <rect x="290" y="76" width="240" height="135" fill="#000">
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete"
      keyTimes="0;0.305;0.635;1" values="1;0;1;1"/>
  </rect>
  <rect x="398" y="215" width="24" height="14" fill="#4a4f57"/>
  <rect x="378" y="229" width="64" height="6" rx="3" fill="#4a4f57"/>

  <!-- Monitor 3, portrait -->
  <rect x="548" y="24" width="133" height="239" rx="6" fill="#4a4f57"/>
  <rect x="552" y="28" width="125" height="231" fill="url(#wall)"/>
  <g transform="translate(567 60) scale(0.63)"><use href="#app"/></g>
  <g transform="translate(567 140) scale(0.63)"><use href="#app"/></g>
  <rect x="552" y="28" width="125" height="231" fill="#000">
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete"
      keyTimes="0;0.635;0.97;1" values="1;1;0;1"/>
  </rect>
  <rect x="592" y="263" width="44" height="6" rx="3" fill="#4a4f57"/>

  <!-- Mouse -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite"
      keyTimes="0;0.28;0.33;0.61;0.66;0.94;1"
      values="150 150;150 150;410 150;410 150;615 150;615 150;150 150"/>
    <path d="M0 0 L0 22 L6 17 L10 26 L14 24 L10 15 L18 15 Z" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
